<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SuaraKami Tutorial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#020617}
body{font-family:Inter,"Inter Display",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#020617}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}

/* text column */
.txt{position:absolute;left:110px;top:0;bottom:0;width:580px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.45);color:#93c5fd;font-weight:800;font-size:20px;letter-spacing:3px}
.badge .of{color:#64748b;letter-spacing:1px}
.txt h2{font-size:58px;line-height:1.08;font-weight:800;letter-spacing:-1.5px}
.txt p{font-size:26px;line-height:1.55;color:#cbd5e1}
.txt p b{color:#fff}
.tip{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;border-radius:20px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.28);font-size:21px;line-height:1.45;color:#fef3c7}
.tip svg{flex:none;margin-top:1px}
.ghost{position:absolute;left:70px;top:40px;font-size:340px;font-weight:900;letter-spacing:-16px;color:rgba(255,255,255,.035);line-height:1}

/* generic ui */
.card{position:absolute;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04)}
.card h3{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.hr{height:1px;background:rgba(255,255,255,.1)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;border-radius:18px;font-weight:700;border:1px solid rgba(255,255,255,.1)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
.input{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:16px;color:#fff;display:flex;align-items:center}
.ph{color:#64748b}
.caret{display:inline-block;width:2px;height:1em;background:#60a5fa;margin-left:2px;vertical-align:-0.12em}
.dark{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.1)}

/* browser window */
.win{position:absolute;border-radius:22px;overflow:hidden;background:#070d1f;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 110px rgba(0,0,0,.6)}
.winbar{height:54px;background:#111a30;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.winbar i{width:14px;height:14px;border-radius:50%;display:block}
.url{margin-left:18px;flex:1;height:34px;border-radius:10px;background:#060b18;color:#cbd5e1;font-size:17px;display:flex;align-items:center;padding:0 14px;gap:10px}

/* monitor */
.monitor{position:absolute}
.bezel{background:#0b0f19;border-radius:18px;padding:12px;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.screen{position:relative;overflow:hidden;border-radius:6px;background:#0f172a}
.base{position:absolute;left:0;top:0;width:1040px;height:585px;transform-origin:0 0}
.neck{margin:0 auto;width:90px;height:44px;background:linear-gradient(#1e293b,#0f172a)}
.foot{margin:0 auto;width:260px;height:12px;border-radius:8px;background:#1e293b}
.slide{position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,#3730a3 0%,rgba(55,48,163,0) 45%),linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%)}
.sbar{position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(#818cf8,#c084fc)}
.stitle{position:absolute;left:72px;top:64px;font-size:54px;font-weight:800;color:#f8fafc;letter-spacing:-1px}
.ssub{position:absolute;left:74px;top:138px;font-size:24px;font-weight:600;color:#a5b4fc}
.sul{position:absolute;left:74px;top:220px;font-size:27px;color:#cbd5e1;font-weight:500}
.sul div{margin-bottom:22px;display:flex;gap:14px;align-items:center}
.sul div:before{content:"";width:12px;height:12px;border-radius:3px;background:#818cf8;display:block}
.sdeco{position:absolute;right:64px;top:210px;width:250px}
.sdeco div{height:46px;border-radius:10px;border:3px solid rgba(129,140,248,.6);margin-bottom:14px;background:rgba(99,102,241,.15)}
.ov{position:absolute;inset:0}
.live{position:absolute;left:56px;right:56px;bottom:34px;display:flex;align-items:flex-end;overflow:hidden}
.subt{font-weight:600;line-height:1.2;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.9),0 0 2px #000}
.hl{color:#facc15;font-weight:900;background:rgba(0,0,0,.35);padding:0 8px;border-radius:10px;text-shadow:0 0 16px rgba(250,204,21,.9)}

/* phone */
.phone{position:absolute;width:340px;height:700px;border-radius:52px;background:#0b0f19;padding:12px;border:1px solid rgba(255,255,255,.18);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.pscreen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#020617}
.pstatus{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:14px;font-weight:700;color:#e2e8f0}
.notch{width:96px;height:26px;border-radius:14px;background:#000}
.purl{margin:0 14px;height:32px;border-radius:10px;background:#0f172a;font-size:12.5px;color:#94a3b8;display:flex;align-items:center;justify-content:center;gap:6px}
.pbody{position:absolute;left:18px;right:18px;top:96px;bottom:18px}
.ptoast{position:absolute;left:16px;right:16px;bottom:26px;padding:12px 14px;border-radius:16px;background:rgba(15,23,42,.95);border:1px solid rgba(34,197,94,.55);font-size:14px;display:flex;align-items:center;gap:10px;font-weight:600}

#cursor{position:absolute;left:0;top:0;width:44px;height:44px;z-index:50;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#ripple{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid #60a5fa;z-index:49;opacity:0}
#prog{position:absolute;left:110px;right:110px;bottom:42px;height:8px;display:flex;gap:12px;z-index:40}
#prog div{flex:1;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#prog div i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#a855f7)}
#fade{position:absolute;inset:0;background:#000;z-index:60;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="bg1" style="width:900px;height:900px;background:rgba(59,130,246,.30)"></div>
  <div class="blob" id="bg2" style="width:900px;height:900px;background:rgba(168,85,247,.26)"></div>
  <div class="blob" id="bg3" style="width:600px;height:600px;background:rgba(236,72,153,.12)"></div>
  <div id="prog"></div>
  <div id="ripple"></div>
  <div id="cursor"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 14.8 L11.5 21.5 L14.2 20.3 L11.3 13.8 L17.5 13.8 Z" fill="#fff" stroke="#0f172a" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="fade"></div>
</div>
<script>
// ---------------------------------------------------------------- helpers
const FPS = 30, DUR = 99.5;
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = s => document.querySelector(s);
function tf(el, { x = 0, y = 0, s = 1, r = 0, o } = {}) {
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  if (o !== undefined) el.style.opacity = o;
}
// pop-in with slight overshoot
function pop(el, t, a, d = .55, { dy = 30, dx = 0, s0 = .9 } = {}) {
  const k = p(t, a, a + d);
  tf(el, { x: (1 - eo(k)) * dx, y: (1 - eo(k)) * dy, s: lerp(s0, 1, back(k)), o: eo(k) });
}
function fadeEl(el, t, a, d = .35) { el.style.opacity = eo(p(t, a, a + d)); }
const caret = t => (Math.floor(t * 2.4) % 2 === 0) ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>';

const SFX = [];
const sfx = (t, type) => SFX.push({ t, type });
// returns fn(t) -> typed substring; registers key sounds
function typer(t0, str, cps = 12) {
  for (let i = 0; i < str.length; i++) if (str[i] !== ' ') sfx(t0 + i / cps, 'key');
  return t => str.slice(0, clamp(Math.floor((t - t0) * cps) + 1, 0, str.length) * (t >= t0 ? 1 : 0));
}

// ---------------------------------------------------------------- icons (lucide-style)
const P = {
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  micoff: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/><line x1="2" x2="22" y1="2" y2="22"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  checkc: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pie: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  type: '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  laptop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
  phone: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  grip: '<circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/>',
  replay: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
};
const ico = (n, s = 24, c = 'currentColor', sw = 2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const LOGO = '../public/logo.png';

// ---------------------------------------------------------------- shared mock builders
function txt(n, title, desc, tip) {
  return `<div class="ghost">0${n}</div><div class="txt">
    <div class="badge"><span>LANGKAH ${n}</span><span class="of">/ 7</span></div>
    <h2>${title}</h2><p>${desc}</p>
    ${tip ? `<div class="tip">${ico('bulb', 26, '#fde047')}<span>${tip}</span></div>` : ''}</div>`;
}
function animTxt(el, lt) {
  el.querySelectorAll('.txt > *').forEach((k, i) => {
    const kk = p(lt, .15 + i * .14, .8 + i * .14);
    tf(k, { x: (1 - eo(kk)) * -50, o: eo(kk) });
  });
  const g = el.querySelector('.ghost');
  if (g) tf(g, { x: (1 - eo(p(lt, 0, 1.2))) * -80, o: eo(p(lt, 0, 1.2)) });
}
function slide() {
  return `<div class="slide"><div class="sbar"></div>
    <div class="stitle">Normalisasi Basis Data</div>
    <div class="ssub">Pertemuan 5 · Sistem Basis Data</div>
    <div class="sul"><div>1NF — Nilai atomik</div><div>2NF — Tanpa ketergantungan parsial</div><div>3NF — Tanpa ketergantungan transitif</div></div>
    <div class="sdeco"><div></div><div style="width:80%;margin-left:20%"></div><div style="width:60%;margin-left:40%"></div></div></div>`;
}
function monitor(id, left, top, w, ovHTML = '') {
  const sw = w - 24, sh = Math.round(sw * 9 / 16), sc = sw / 1040;
  return `<div class="monitor" id="${id}" style="left:${left}px;top:${top}px;width:${w}px">
    <div class="bezel"><div class="screen" style="width:${sw}px;height:${sh}px">
      <div class="base" style="transform:scale(${sc})">${slide()}<div class="ov" id="${id}-ov">${ovHTML}</div></div>
    </div></div><div class="neck"></div><div class="foot"></div></div>`;
}
function phone(id, left, top, body) {
  return `<div class="phone" id="${id}" style="left:${left}px;top:${top}px"><div class="pscreen">
    <div class="abs" style="width:300px;height:300px;right:-120px;top:-60px;border-radius:50%;background:rgba(59,130,246,.18);filter:blur(60px)"></div>
    <div class="abs" style="width:300px;height:300px;left:-120px;bottom:-60px;border-radius:50%;background:rgba(168,85,247,.16);filter:blur(60px)"></div>
    <div class="pstatus"><span>09:30</span><span class="notch"></span><span>5G</span></div>
    <div class="purl">${ico('lock', 12, '#94a3b8')} suaradosen-app-pbd.web.app/?mode=tts</div>
    <div class="pbody">${body}</div></div></div>`;
}
const phoneHeader = `<div style="text-align:center;padding:10px 0 16px;border-bottom:1px solid rgba(255,255,255,.1)">
  <div style="font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">${ico('msg', 24, '#60a5fa')} SuaraKami</div>
  <span class="pill" style="margin-top:8px;background:rgba(0,0,0,.4);color:#93c5fd">TTS Mode</span></div>`;
const toast = (id, msg, err) => `<div class="ptoast" id="${id}" style="opacity:0">${ico('checkc', 18, '#4ade80')}${msg}</div>`;
function waveBars(n, cls) { let s = ''; for (let i = 0; i < n; i++) s += `<i class="${cls}" style="display:block;width:6px;border-radius:3px;background:currentColor"></i>`; return s; }
function animWave(sel, t, amp, base = 6, maxH = 40) {
  document.querySelectorAll(sel).forEach((b, i) => {
    const h = base + amp * maxH * (0.35 + 0.65 * Math.abs(Math.sin(t * 7.3 + i * 1.7) * Math.cos(t * 3.1 + i * .6)));
    b.style.height = h + 'px';
  });
}

// ---------------------------------------------------------------- scene system + cursor
const scenes = [];
function scene(a, b, html, update, step) {
  const el = document.createElement('div');
  el.className = 'scene'; el.innerHTML = html;
  stage.insertBefore(el, $('#prog'));
  scenes.push({ a, b, el, update, step });
  if (a > 0) sfx(a + .05, 'whoosh');
  return el;
}
const CUR = []; // groups of keyframes
function cursorTrack(kfs) { CUR.push(kfs); kfs.forEach(k => { if (k.click) sfx(k.t, 'click'); }); }
function kfPos(k) {
  if (Array.isArray(k.at)) return { x: k.at[0], y: k.at[1] };
  const el = $(k.at); const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 + (k.dx || 0), y: r.top + r.height / 2 + (k.dy || 0) };
}
function renderCursor(t) {
  const cur = $('#cursor'), rip = $('#ripple');
  cur.style.opacity = 0; rip.style.opacity = 0;
  for (const g of CUR) {
    const t0 = g[0].t - .5, t1 = g[g.length - 1].t + .6;
    if (t < t0 || t > t1) continue;
    let pos;
    if (t <= g[0].t) pos = kfPos(g[0]);
    else if (t >= g[g.length - 1].t) pos = kfPos(g[g.length - 1]);
    else {
      let i = 0; while (g[i + 1].t < t) i++;
      const A = g[i], B = g[i + 1];
      const ms = Math.max(A.t, B.t - (B.move || .85));
      const k = eio(p(t, ms, B.t));
      const pa = kfPos(A), pb = kfPos(B);
      pos = { x: lerp(pa.x, pb.x, k), y: lerp(pa.y, pb.y, k) };
    }
    const o = Math.min(eo(p(t, t0, t0 + .35)), 1 - p(t, t1 - .35, t1));
    let s = 1;
    for (const k of g) if (k.click) {
      const d = t - k.t;
      if (d > -.08 && d < .16) s = .82;
      if (d >= 0 && d < .5) { const q = d / .5; rip.style.opacity = (1 - q) * o; rip.style.transform = `translate(${pos.x}px,${pos.y}px) scale(${.3 + q * 1.1})`; }
    }
    cur.style.opacity = o;
    cur.style.transform = `translate(${pos.x - 7}px,${pos.y - 4}px) scale(${s})`;
    cur.style.transformOrigin = '7px 4px';
  }
}

// ================================================================= SCENE 0 — INTRO (0–6)
{
  const a = 0, b = 6;
  let bars = ''; for (let i = 0; i < 28; i++) bars += `<i style="display:block;width:8px;border-radius:4px;background:linear-gradient(#60a5fa,#c084fc)"></i>`;
  const el = scene(a, b, `
    <div class="abs" id="i-glow" style="left:660px;top:70px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.45),rgba(129,140,248,0) 65%)"></div>
    <div class="abs" id="i-ring" style="left:810px;top:220px;width:300px;height:300px;border-radius:50%;border:3px solid rgba(147,197,253,.6)"></div>
    <img id="i-logo" src="${LOGO}" style="position:absolute;left:830px;top:240px;width:260px;height:260px;border-radius:60px;box-shadow:0 30px 80px rgba(0,0,0,.5)">

        ${qb('c7-t1', '1 Min', 'rgba(59,130,246,.2)', '#93c5fd')}${qb('c7-t5', '5 Min', 'rgba(59,130,246,.2)', '#93c5fd')}${qb('c7-t10', '10 Min', 'rgba(59,130,246,.2)', '#93c5fd')}${qb('c7-ts', 'Stop', 'rgba(239,68,68,.2)', '#fca5a5')}</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        ${qb('c7-f1', 'Tanya Jawab', 'rgba(168,85,247,.2)', '#d8b4fe')}${qb('c7-f2', 'Kuis', 'rgba(249,115,22,.2)', '#fdba74')}${qb('c7-f3', 'Istirahat', 'rgba(34,197,94,.2)', '#86efac')}${qb('c7-f4', 'Perhatikan!', 'rgba(239,68,68,.2)', '#fca5a5')}</div>
      <div style="font-size:17px;color:#cbd5e1;display:flex;gap:8px;align-items:center;margin-top:26px">${ico('vol', 18)} Soundboard Interaktif</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px">
        <div id="c7-s1" class="btn dark" style="height:86px;flex-direction:column;gap:6px;font-size:13px;color:#cbd5e1">${ico('checkc', 24, '#4ade80')}Benar (Ding)</div>
        <div class="btn dark" style="height:86px;flex-direction:column;gap:6px;font-size:13px;color:#cbd5e1">${ico('alert', 24, '#f87171')}Salah (Buzzer)</div>
        <div class="btn dark" style="height:86px;flex-direction:column;gap:6px;font-size:13px;color:#cbd5e1">${ico('bell', 24, '#60a5fa')}Info (Chime)</div></div>
    </div>
    ${monitor('m7', 1260, 290, 570, ov)}
  `, (t, lt) => {
    animTxt(el, lt);
    const sw = p(lt, 6.2, 6.8);
    pop($('#c7a'), lt, .2, .6, { dy: 50 }); pop($('#p7'), lt, .35, .6, { dy: 60 });
    if (sw > 0) { tf($('#c7a'), { x: -40 * eo(sw), o: 1 - sw }); tf($('#p7'), { x: 40 * eo(sw), o: 1 - sw }); }
    tf($('#c7b'), { x: 40 * (1 - eo(p(lt, 6.4, 7.0))), o: eo(p(lt, 6.4, 7.0)) });
    tf($('#m7'), { y: 50 * (1 - eo(p(lt, 6.5, 7.1))), o: eo(p(lt, 6.5, 7.1)) });
    const active = lt > 1.0;
    const bt = $('#c7-btn');
    bt.textContent = active ? 'Hentikan Kuis' : 'Mulai Kuis A/B/C/D';
    bt.style.background = active ? 'rgba(239,68,68,.25)' : 'rgba(34,197,94,.25)';
    bt.style.color = active ? '#fca5a5' : '#86efac';
    const qk = p(lt, 1.3, 1.6) * (1 - p(lt, 2.75, 3.0));
    tf($('#p7-quiz'), { s: lerp(.92, 1, eo(qk)), o: qk }); $('#p7-msg').style.opacity = 1 - qk;
    $('#p7-B').style.background = lt > 2.55 ? '#22c55e' : '#2563eb';
    tf($('#p7-t'), { y: (1 - eo(p(lt, 2.7, 3.0))) * 20, o: eo(p(lt, 2.7, 3.0)) * (1 - p(lt, 4.6, 4.9)) });
    const vk = eo(p(lt, 2.8, 5.4));
    const v = {}; let tot = 0;
    for (const c in target) { v[c] = Math.round(target[c] * vk); tot += v[c]; }
    for (const c in target) {
      const pc = tot ? Math.round(v[c] / tot * 100) : 0;
      $('#c7-bar' + c).style.width = pc + '%';
      $('#c7-v' + c).textContent = `${v[c]} Suara (${pc}%)`;
    }
    // timer & flash
    const tk = p(lt, 7.3, 7.7);
    tf($('#m7-timer'), { s: lerp(.6, 1, back(tk)), o: eo(tk) });
    const rem = 300 - Math.max(0, Math.floor(lt - 7.3));
    $('#m7-tt').textContent = String(Math.floor(rem / 60)).padStart(2, '0') + ':' + String(rem % 60).padStart(2, '0');
    const fk = p(lt, 9.4, 9.8) * (1 - p(lt, 11.9, 12.3));
    $('#m7-flash').style.opacity = fk;
    tf($('#m7-ft'), { s: lerp(1.3, 1, eo(p(lt, 9.4, 9.9))) * (1 + .03 * Math.sin(lt * 8)), o: .75 + .25 * Math.sin(lt * 6) });
  }, 6);
  cursorTrack([{ t: a + .7, at: [1200, 900] }, { t: a + 1.0, at: '#c7-btn', click: true }, { t: a + 2.55, at: '#p7-B', click: true }, { t: a + 3.8, at: '#p7-B', dx: 80, dy: 140 },
    { t: a + 7.3, at: '#c7-t5', click: true }, { t: a + 9.4, at: '#c7-f2', click: true }, { t: a + 11.9, at: '#c7-s1', click: true }, { t: a + 12.5, at: '#c7-s1', dx: 60, dy: 60 }]);
  sfx(a + 2.7, 'pop'); sfx(a + 9.45, 'chime'); sfx(a + 11.95, 'ding');
}

{

      <div><div style="font-size:30px;font-weight:800">SuaraKami <span class="pill" style="background:rgba(0,0,0,.4);color:#93c5fd">Pro</span></div>

    <div id="pdf" class="abs" style="left:1040px;top:315px;width:500px;height:560px;border-radius:10px;background:#fff;color:#0f172a;padding:36px 38px;box-shadow:0 40px 100px rgba(0,0,0,.6);opacity:0">

  `, (t, lt) => {

    tf($('#pdf'), { y: lerp(-260, 0, eo(k)), s: lerp(.2, 1, eo(k)), r: lerp(-12, -2, eo(k)) + Math.sin(lt * 1.5) * .6 * k, o: eo(p(lt, 1.6, 1.9)) });

  cursorTrack([{ t: a + .8, at: [1300, 700] }, { t: a + 1.4, at: '#h8-dl', click: true }, { t: a + 2.4, at: '#h8-dl', dx: 120, dy: 140 }]);

// ================================================================= SCENE 9 — OUTRO (92–99.5)
{
  const a = 92, b = DUR;
  const steps = ['Buka Dashboard', 'Jalankan Aplikasi', 'Mulai Bicara', 'Atur Tampilan', 'Tanya Jawab', 'Kuis &amp; Timer', 'Unduh PDF'];
  const el = scene(a, b, `
    <img id="e-logo" src="${LOGO}" style="position:absolute;left:885px;top:200px;width:150px;height:150px;border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.5)">

        <div style="width:46px;height:46px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px">${i + 1}</div>

  `, (t, lt) => {
    pop($('#e-logo'), lt, .2, .7, { dy: 40, s0: .5 });
    pop($('#e-title'), lt, .5, .7, { dy: 40, s0: .96 });

// ---------------------------------------------------------------- progress bar
const prog = $('#prog');
for (let i = 0; i < 7; i++) prog.innerHTML += '<div><i></i></div>';

// ---------------------------------------------------------------- master render
function render(t) {
  // background drift
  tf($('#bg1'), { x: -250 + Math.sin(t * .23) * 120, y: -300 + Math.cos(t * .19) * 80 });
  tf($('#bg2'), { x: 1250 + Math.cos(t * .21) * 120, y: 500 + Math.sin(t * .17) * 90 });
  tf($('#bg3'), { x: 800 + Math.sin(t * .15) * 300, y: 300 + Math.cos(t * .13) * 200 });
  for (const s of scenes) {
    if (t < s.a || t > s.b) { s.el.style.display = 'none'; continue; }
    s.el.style.display = 'block';
    const isLast = s.b >= DUR;
    s.el.style.opacity = Math.min(s.a === 0 ? 1 : eo(p(t, s.a, s.a + .5)), isLast ? 1 : 1 - p(t, s.b - .45, s.b));
    s.update(t, t - s.a);
  }
  // progress bar (steps 1..7)
  const stepScenes = scenes.filter(s => s.step);
  prog.style.opacity = eo(p(t, 14, 14.6)) * (1 - p(t, 91.4, 92));
  stepScenes.forEach((s, i) => { prog.children[i].firstChild.style.width = (p(t, s.a, s.b) * 100) + '%'; });
  renderCursor(t);
  $('#fade').style.opacity = p(t, DUR - .9, DUR);
}
window.render = render; window.SFX = SFX; window.DUR = DUR; window.FPS = FPS;
const q = new URLSearchParams(location.search);
render(q.has('t') ? parseFloat(q.get('t')) : 0);
</script>
